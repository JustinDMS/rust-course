[package]
name = "course"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Build and verify tool for the interactive Rust course"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }

[package]
name = "course"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Local server for the interactive Rust course"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs"] }

[[exercise]]
id = "ch08/ex05"
crate = "ch08_collections"
target = "ex05_borrow_while_iterating"
title = "Changing a collection you are looking at"
kind = "fix"
xp = 35
description = """
Three functions mutate a collection while iterating over it, and the
borrow checker says no. Each has an idiomatic fix: `retain`, collect then
`extend`, and `values_mut`.
"""
hints = [
  "`drop_below`: `values.retain(|&v| v >= min);` keeps the elements for which the closure is true. (Removing inside a `for` loop would also skip elements, even in languages that allow it.)",
  "`duplicate_evens`: gather the evens into a new `Vec` first, then `values.extend(evens);` after the loop.",
  "`apply_bonus`: `for score in scores.values_mut() { *score += bonus; updated += 1; }`. The `insert` after the loop is fine, because the mutable borrow from `values_mut()` ended with the loop.",
]


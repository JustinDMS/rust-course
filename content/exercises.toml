description = """
The book's pig latin exercise: move a leading consonant to the end with
`ay`, or append `hay` after a vowel. Then apply it to every word in a
sentence.
"""
hints = [
  "`let mut chars = word.chars(); let Some(first) = chars.next() else { return String::new(); };` handles the empty case and gives you the first character.",
  "`\"aeiouAEIOU\".contains(first)` tests for a vowel. For consonants, `let rest: String = chars.collect();` is everything after the first character; then `format!(\"{rest}-{first}ay\")`.",
  "`pig_latin_sentence`: collect `pig_latin(word)` for each `word in sentence.split_whitespace()` into a `Vec<String>`, then `.join(\" \")`.",
]


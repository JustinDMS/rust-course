# Chapter 3: Common Programming Concepts
# ---------------------------------------------------------------------------

[[exercise]]
id = "ch03/ex01"
crate = "ch03_common_concepts"
target = "ex01_variables"
title = "Mutability, constants and shadowing"
kind = "fix"
xp = 25
description = """
Three compile errors, one per concept: a `const` without a type, a counter
that is changed without `mut`, and an assignment that tries to change a
variable's type. Fix them. Do not edit the tests.
"""
hints = [
  "Constants always need an explicit type: `const MAX_HP: u32 = 99;`.",
  "`total += i` changes `total`, so declare it `let mut total = 0;`.",
  "`label` starts as a `u32` and needs to become a `String`. Assignment cannot change a type, but a second `let label = format!(...)` can (shadowing). Then the first `let` does not need `mut` at all.",
]

[[exercise]]
id = "ch03/ex02"
crate = "ch03_common_concepts"
target = "ex02_data_types"
title = "Scalars, tuples and arrays"
kind = "implement"
xp = 35
description = """
Five small functions on numbers, tuples and arrays. Remember that `i32`
and `f64` never mix without `as`, and that integer overflow is something
you decide about explicitly.
"""
hints = [
  "Float literals need a decimal point: `celsius * 9.0 / 5.0 + 32.0`. `9 / 5` would be integer division (1).",
  "`average`: `for v in values { sum += v; }`, then `sum as f64 / 4.0`.",
  "`swap_pair`: destructure with `let (a, b) = pair;` and return `(b as f64, a)`.",
  "`add_u8`: `a.checked_add(b)` already returns `Option<u8>`.",
]

[[exercise]]
id = "ch03/ex03"
crate = "ch03_common_concepts"
target = "ex03_functions"
title = "Statements and expressions"
kind = "fix"
xp = 25
description = """
Three functions, three compile errors: a stray semicolon, a parameter
without a type, and a `let` used as a value. Fix them. Do not edit the
tests.
"""
hints = [
  "`x * x;` with the semicolon is a statement, so the function returns `()`. Remove the semicolon.",
  "`fn max3(a: i32, b, c: i32)`: `b` needs a type, `b: i32`.",
  "`let doubled = (let d = n * 2);` cannot work because `let` produces no value. Write `let doubled = n * 2;`.",
]

[[exercise]]
id = "ch03/ex04"
crate = "ch03_common_concepts"
target = "ex04_control_flow"
title = "Loops and conditions"
kind = "implement"
xp = 40
description = """
Fibonacci, Collatz, a filtered sum and a countdown: four functions, four
chances to pick between `for`, `while` and `loop`.
"""
hints = [
  "`fib`: keep `a = 0` and `b = 1`; `for _ in 0..n { let next = a + b; a = b; b = next; }` and return `a`. Use `u64` for the running values, the test for `fib(50)` overflows a `u32`.",
  "`collatz_steps`: `while n != 1 { n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 }; steps += 1; }`. The parameter is already `mut n`.",
  "`sum_odds_below`: `for i in 0..limit { if i % 2 == 1 { sum += i; } }`.",
  "`countdown`: `for i in (1..=from).rev() { text.push_str(&format!(\"{i}, \")); }` then `text.push_str(\"liftoff!\")`.",
]


The book's text-interface exercise, with the parsing done through a slice
pattern. A `HashMap<String, Vec<String>>`, `entry().or_default()`, and
sorting so the output is predictable.
"""
hints = [
  "`add`: `let words: Vec<&str> = command.split_whitespace().collect();` then `match words.as_slice() { [\"Add\", name, \"to\", dept] => { ... true } _ => false }`.",
  "Inside that arm: `self.departments.entry(dept.to_string()).or_default().push(name.to_string());`. `or_default` creates an empty `Vec` the first time a department is seen.",
  "`people_in`: `self.departments.get(department)` gives `Option<&Vec<String>>`; clone it (or build an empty vec), then `sort()`.",
  "`all`: push `(dept.clone(), self.people_in(dept))` for every key, then `out.sort()`: tuples sort by their first element first.",

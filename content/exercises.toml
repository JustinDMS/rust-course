crate = "ch01_getting_started"
target = "ex02_greeting"
title = "Your first functions"
kind = "implement"
xp = 25
description = """
Three functions that build strings. `format!` works like `println!` but
returns the text instead of printing it; `"=".repeat(5)` is `"====="`.
"""
hints = [
  "`greeting`: `format!(\"Hello, {name}!\")`.",
  "`banner`: build the line of `=` with `\"=\".repeat(text.len())`, then `format!(\"{line}\n{text}\n{line}\")`.",

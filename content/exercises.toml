[[exercise]]
id = "ch03/ex01"
crate = "ch03_common_concepts"
target = "ex01_variables"
title = "Mutability, constants and shadowing"
kind = "fix"
xp = 25
description = """
Three compile errors, one per concept: a `const` without a type, a counter
that is changed without `mut`, and an assignment that tries to change a
variable's type. Fix them. Do not edit the tests.
"""
hints = [
  "Constants always need an explicit type: `const MAX_HP: u32 = 99;`.",
  "`total += i` changes `total`, so declare it `let mut total = 0;`.",
  "`label` starts as a `u32` and needs to become a `String`. Assignment cannot change a type, but a second `let label = format!(...)` can (shadowing). Then the first `let` does not need `mut` at all.",
]


[[exercise]]
id = "ch08/ex01"
crate = "ch08_collections"
target = "ex01_vectors"
title = "Median and mode"
kind = "implement"
xp = 40
description = """
The book's end-of-chapter exercise: median and mode of a list of integers,
plus a filter. Sorting a copy, indexing, and a `HashMap` of counts.
"""
hints = [
  "`median`: return `None` early if empty. `let mut sorted = values.to_vec(); sorted.sort();` then pick `sorted[n / 2]` for odd `n`, or average `sorted[n / 2 - 1]` and `sorted[n / 2]` for even `n`. Convert with `as f64` before dividing.",
  "`mode`: `*counts.entry(v).or_insert(0) += 1;` for each value. Then walk the map keeping the best `(value, count)`; replace when the count is higher, or equal with a smaller value.",
  "`evens`: a `for &v in values` loop with `if v % 2 == 0 { out.push(v) }`.",
]

[[exercise]]
id = "ch08/ex02"
crate = "ch08_collections"
target = "ex02_strings"
title = "Strings are not arrays of chars"
kind = "fix"
xp = 35
description = """
`s[0]`, byte slicing through a multi-byte character, and `+` on a
borrowed `String`: three things Rust strings do not allow, or allow only
when you mean bytes. Fix them. Do not edit the tests.
"""
hints = [
  "`first_char`: `s.chars().next()` already returns `Option<char>`, `None` for an empty string.",
  "`take_chars`: `&s[..n]` counts bytes and panics mid-character. Take characters instead: `s.chars().take(n).collect()` (the return type tells `collect` to build a `String`).",
  "`full_name`: `+` wants an owned `String` on the left. `format!(\"{first} {last}\")` borrows both; or `first.clone() + \" \" + last`.",
]

[[exercise]]

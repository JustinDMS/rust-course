kind = "project"
xp = 30
file = "projects/guessing_game/src/lib.rs"
solution = "solutions/guessing_game/src/lib.rs"
description = """
Implement `parse_guess` in `projects/guessing_game/src/lib.rs`: trim the
input, parse it as a `u32`, and turn the `Result` into an `Option` with a
`match`.
"""
